<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>UNSC Simulation 2026</title><link rel="manifest" href="/manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061326,#0b2342);color:#f5f7fa;font:16px system-ui}main{max-width:720px;margin:auto;padding:24px 16px 60px}.brand{color:#d7b66d;font-size:12px;letter-spacing:.14em;font-weight:700}h1{font-size:28px}.panel{background:#10294a;border:1px solid #2b496c;border-radius:18px;padding:18px;margin:16px 0}p,.muted{color:#aebdd0;line-height:1.5}input,textarea,button{width:100%;padding:13px;border-radius:10px;margin:6px 0;font:inherit}input,textarea{background:#071a33;color:white;border:1px solid #45617f}button{background:#d7b66d;border:0;color:#17243a;font-weight:700;cursor:pointer}.secondary{background:#1b3a60;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}.flag{font-size:40px}.item,.msg{padding:12px 0;border-bottom:1px solid #34506d}.msg{background:#0a1e38;border:0;padding:12px;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}
</style></head><body><main><div class="brand">UNITED NATIONS · SECURITY COUNCIL</div><h1>Кризис Нордании</h1><p>Мобильная платформа заседания · 2026</p><section id="login" class="panel"><h2>Вход делегации</h2><p>Введите пароль, выданный секретариатом.</p><input id="pass" type="password" placeholder="Пароль делегации"><button id="enter">Войти</button><div id="err" class="muted"></div></section>
<div id="app" class="hidden"><section class="panel"><div class="flag" id="flag"></div><h2 id="country"></h2><span class="muted">Личный кабинет делегации</span><button class="secondary" id="exit">Выйти</button></section><div class="grid"><button data-tab="news">Новости</button><button data-tab="docs">Документы</button><button data-tab="votes">Голосование</button><button data-tab="chat" id="chatBtn" class="hidden">Закрытый канал</button></div>
<section id="news" class="panel"><h2>Новости</h2><div id="newsList"></div></section><section id="docs" class="panel hidden"><h2>Документы</h2><div id="docsList"></div></section><section id="votes" class="panel hidden"><h2>Голосование</h2><div id="voteList"></div></section><section id="chat" class="panel hidden"><h2>Закрытый канал США — Турция</h2><div id="msgs"></div><textarea id="message" placeholder="Сообщение"></textarea><button id="send">Отправить</button></section></div></main>
<script>
let me;const $=x=>document.getElementById(x);async function api(p,o={}){let r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('enter').onclick=async()=>{try{let d=await api('login',{method:'POST',body:JSON.stringify({password:$('pass').value})});me=d.delegate;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('flag').textContent=me.flag;$('country').textContent=me.name;$('chatBtn').classList.toggle('hidden',!['usa','turkey'].includes(me.id));await refresh()}catch(e){$('err').textContent=e.message}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>['news','docs','votes','chat'].forEach(t=>$(t).classList.toggle('hidden',t!==b.dataset.tab)));
async function refresh(){let d=await api('content');$('newsList').innerHTML=d.news.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div>`).join('')||'Объявлений пока нет';$('docsList').innerHTML=d.documents.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div>`).join('')||'Документов пока нет';$('voteList').innerHTML=d.resolutions.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.text)}</p>${x.status==='open'?['for','against','abstain'].map((v,i)=>`<button class="secondary" onclick="cast(${x.id},'${v}')">${['За','Против','Воздержаться'][i]}</button>`).join(''):'Голосование закрыто'}</div>`).join('')||'Нет проектов';if(['usa','turkey'].includes(me.id))await loadChat()}
async function cast(id,choice){try{await api('vote',{method:'POST',body:JSON.stringify({resolution_id:id,choice})});alert('Голос принят');refresh()}catch(e){alert(e.message)}}
async function loadChat(){let d=await api('chat');$('msgs').innerHTML=d.messages.map(m=>`<div class="msg"><b>${m.sender_id==='usa'?'США':'Турция'}</b><p>${esc(m.body)}</p><small>${new Date(m.created_at).toLocaleString()}</small></div>`).join('')}
$('send').onclick=async()=>{try{await api('chat',{method:'POST',body:JSON.stringify({body:$('message').value})});$('message').value='';loadChat()}catch(e){alert(e.message)}};
$('exit').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
</script></body></html>
