<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNSC · Секретариат</title><style>body{background:#071a33;color:white;font:16px system-ui;max-width:720px;margin:auto;padding:20px}section{background:#10294a;padding:18px;border-radius:16px;margin:14px 0}input,textarea,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:9px}input,textarea{background:#071a33;color:white;border:1px solid #567}button{background:#d7b66d;border:0;font-weight:bold}small{color:#adbdcf}</style></head><body><h1>Панель секретариата</h1><section id="auth"><input id="ap" type="password" placeholder="Пароль администратора"><button onclick="login()">Войти</button><div id="error"></div></section><div id="panel" style="display:none"><section><h2>Пароли делегаций</h2><div id="delegates"></div><button onclick="save()">Сохранить пароли</button><small>Минимум 8 символов. Для каждой страны задайте свой пароль.</small></section><section><h2>Объявление</h2><input id="at" placeholder="Заголовок"><textarea id="ab" placeholder="Текст"></textarea><button onclick="post('announcement')">Опубликовать</button></section><section><h2>Документ</h2><input id="dt" placeholder="Название"><textarea id="db" placeholder="Текст документа"></textarea><button onclick="post('document')">Опубликовать</button></section><section><h2>Проект резолюции</h2><input id="rt" placeholder="Название"><textarea id="rb" placeholder="Текст проекта"></textarea><button onclick="post('resolution')">Создать</button></section><section><h2>Голосование</h2><input id="rid" type="number" placeholder="ID резолюции"><button onclick="status('open')">Открыть</button><button onclick="status('closed')">Закрыть</button><button onclick="results()">Результаты</button><pre id="out"></pre></section></div>
<script>const $=x=>document.getElementById(x);async function api(p,o={}){let r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function login(){try{await api('admin/login',{method:'POST',body:JSON.stringify({password:$('ap').value})});$('auth').style.display='none';$('panel').style.display='block';let d=await api('admin/delegations');$('delegates').innerHTML=d.delegates.map(x=>`<label>${x.flag} ${x.name}<input type="password" data-id="${x.id}" placeholder="Новый пароль"></label>`).join('')}catch(e){$('error').textContent=e.message}}
async function save(){try{let delegates=[...document.querySelectorAll('[data-id]')].filter(x=>x.value).map(x=>({id:x.dataset.id,password:x.value}));await api('admin/passwords',{method:'POST',body:JSON.stringify({delegates})});alert('Пароли сохранены')}catch(e){alert(e.message)}}
async function post(type){try{let data=type==='announcement'?{title:$('at').value,body:$('ab').value}:type==='document'?{title:$('dt').value,body:$('db').value}:{title:$('rt').value,text:$('rb').value};let d=await api('admin/'+type,{method:'POST',body:JSON.stringify(data)});alert('Сохранено. ID: '+d.id)}catch(e){alert(e.message)}}
async function status(status){try{await api('admin/resolution-status',{method:'POST',body:JSON.stringify({id:+$('rid').value,status})});alert('Статус обновлён')}catch(e){alert(e.message)}}
async function results(){try{let d=await api('admin/results?id='+$('rid').value);$('out').textContent=JSON.stringify(d,null,2)}catch(e){alert(e.message)}}</script></body></html>
